# =============================================================
# PHO Website - Nginx Configuration
# =============================================================
# Add this as a server block in your nginx.conf or as a
# separate file in /etc/nginx/sites-available/pho-website
# Then symlink to /etc/nginx/sites-enabled/
#
# After editing, test with:  nginx -t
# Then reload with:          systemctl reload nginx
# =============================================================

server {
    listen 80;
    # listen 443 ssl;  # Uncomment and add SSL cert paths for HTTPS

    # Replace with the actual domain name
    server_name pho.bohol.gov.ph www.pho.bohol.gov.ph;

    # Replace with the actual path to the website files on the server
    root /var/www/pho-website;
    index index.html;

    # ---- Character Encoding ----
    charset utf-8;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Hide nginx version
    server_tokens off;

    # ---- Block Sensitive Files & Directories ----

    # Block .git directory
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Block .env, .sql, .md, .gitignore files
    location ~* \.(env|sql|gitignore|md)$ {
        deny all;
        return 404;
    }

    # Block supabase directory
    location ^~ /supabase/ {
        deny all;
        return 404;
    }

    # Block node_modules (if any)
    location ^~ /node_modules/ {
        deny all;
        return 404;
    }

    # Block hidden files (starting with .)
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- Clean URLs ----

    # 1) Redirect /index.html to /
    location = /index.html {
        return 301 /;
    }

    # 2) Redirect any .html request to clean URL
    #    /contact-us.html  -->  /contact-us
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # 3) Serve clean URLs by trying the .html file
    #    /contact-us  -->  serves contact-us.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- Static Asset Caching ----
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Custom Error Pages (optional) ----
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
}
