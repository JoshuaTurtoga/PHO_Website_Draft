# GitLab Pages deployment configuration
# This pipeline deploys the static site to GitLab Pages

pages:
  stage: deploy
  script:
    - New-Item -ItemType Directory -Force -Path public
    - Copy-Item -Path *.html,*.css,*.js -Destination public/ -Force
    - Copy-Item -Path assets -Destination public/ -Recurse -Force
    - Copy-Item -Path admin -Destination public/ -Recurse -Force
    - Copy-Item -Path supabase -Destination public/ -Recurse -Force
    - Copy-Item -Path robots.txt -Destination public/ -Force
  artifacts:
    paths:
      - public
  only:
    - main
  tags: []
