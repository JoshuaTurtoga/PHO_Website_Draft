<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | PHO Bohol CMS</title>
  <!-- SEO: noindex so this page never appears in search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #0d9488;
      --teal-dark:  #0f766e;
      --teal-glow:  rgba(13,148,136,.35);
      --blue-dark:  #0a1628;
      --navy:       #0f1f3d;
      --surface:    rgba(255,255,255,.06);
      --border:     rgba(255,255,255,.12);
      --text:       #e2e8f0;
      --muted:      #94a3b8;
      --danger:     #f87171;
      --success:    #34d399;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--blue-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Animated background ─────────────────────────────── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 120% 80% at 20% 10%, #0a2540 0%, var(--blue-dark) 60%),
                  radial-gradient(ellipse 80% 60% at 80% 90%, #0d3320 0%, transparent 60%);
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 1;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .orb-1 { width: 600px; height: 600px; top: -200px; left: -200px; background: rgba(13,148,136,.12); animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; bottom: -100px; right: -100px; background: rgba(14,165,233,.10); animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; top: 40%; left: 60%; background: rgba(16,185,129,.08); animation-delay: -2s; }

    @keyframes floatOrb {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, -30px) scale(1.05); }
    }

    /* ── Login card ──────────────────────────────────────── */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      margin: 1rem;
      background: rgba(15,31,61,.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Logo area ───────────────────────────────────────── */
    .logo-wrap {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .logo-img { width: 44px; height: 44px; object-fit: contain; }
    .logo-text { line-height: 1.2; }
    .logo-title { font-size: .85rem; font-weight: 700; color: var(--text); letter-spacing: .02em; }
    .logo-sub   { font-size: .72rem; color: var(--muted); }

    .card-heading {
      font-size: 1.45rem; font-weight: 800;
      color: #fff; margin-bottom: .35rem;
      letter-spacing: -.02em;
    }
    .card-subheading {
      font-size: .85rem; color: var(--muted); margin-bottom: 2rem;
    }
    .admin-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(13,148,136,.15); border: 1px solid rgba(13,148,136,.3);
      color: var(--teal); font-size: .7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: .25rem .6rem; border-radius: 20px; margin-bottom: 1.25rem;
    }
    .admin-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    /* ── Form ────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      display: block; font-size: .8rem; font-weight: 600;
      color: var(--muted); margin-bottom: .45rem; letter-spacing: .03em;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--muted); width: 16px; height: 16px; pointer-events: none;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      padding: .75rem .9rem .75rem 2.5rem;
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--teal);
      background: rgba(13,148,136,.08);
      box-shadow: 0 0 0 3px var(--teal-glow);
    }
    .form-input::placeholder { color: #475569; }

    .toggle-pw {
      position: absolute; right: .9rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 0; line-height: 0;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* ── Submit button ───────────────────────────────────── */
    .btn-login {
      width: 100%; margin-top: 1.5rem;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      color: #fff; border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: .9rem; font-weight: 700;
      padding: .85rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      box-shadow: 0 4px 20px rgba(13,148,136,.4);
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(13,148,136,.55);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert ───────────────────────────────────────────── */
    .alert {
      border-radius: 10px; padding: .75rem 1rem;
      font-size: .82rem; font-weight: 500;
      margin-top: 1rem; display: none;
      animation: alertIn .25s ease;
    }
    @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .alert.error {
      display: flex; gap: .5rem; align-items: flex-start;
      background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); color: var(--danger);
    }
    .alert.success {
      display: flex; gap: .5rem; align-items: flex-start;
      background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35); color: var(--success);
    }

    /* ── Security notice ─────────────────────────────────── */
    .security-notice {
      margin-top: 1.75rem; padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: .5rem;
      font-size: .72rem; color: #475569;
    }
    .security-notice svg { flex-shrink: 0; color: #334155; }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="card" role="main">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="assets/logo/pho_logo.png" alt="PHO Bohol Logo" class="logo-img" />
      <div class="logo-text">
        <div class="logo-title">Bohol Provincial Health Office</div>
        <div class="logo-sub">Province of Bohol, Philippines</div>
      </div>
    </div>

    <div class="admin-badge">
      <span>CMS Admin</span>
    </div>

    <h1 class="card-heading">Admin Sign In</h1>
    <p class="card-subheading">Authorized personnel only. Access restricted.</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password visibility">
            <svg id="eye-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">
        <div class="spinner"></div>
        <span class="btn-text">Sign In to CMS</span>
      </button>

      <div class="alert" id="login-alert" role="alert"></div>
    </form>

    <div class="security-notice">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>This page is not publicly indexed. Unauthorized access attempts are logged.</span>
    </div>

  </main>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="cms-config.js"></script>
  <script>
    const client = getSupabaseClient();

    /* ── Redirect if already logged in ─────────────────── */
    (async () => {
      if (!client) return;
      const { data: { session } } = await client.auth.getSession();
      if (session) window.location.replace('phoadmindashboard.html');
    })();

    /* ── Toggle password visibility ─────────────────────── */
    const pwInput   = document.getElementById('login-password');
    const toggleBtn = document.getElementById('toggle-pw');
    const eyeIcon   = document.getElementById('eye-icon');
    const eyeSlash  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    let pwVisible = false;
    toggleBtn.addEventListener('click', () => {
      pwVisible = !pwVisible;
      pwInput.type = pwVisible ? 'text' : 'password';
      eyeIcon.innerHTML = pwVisible ? eyeSlash : eyeOpen;
    });

    /* ── Login form submit ───────────────────────────────── */
    const form      = document.getElementById('login-form');
    const btnLogin  = document.getElementById('btn-login');
    const alertBox  = document.getElementById('login-alert');

    function showAlert(msg, type = 'error') {
      alertBox.className = `alert ${type}`;
      alertBox.innerHTML = type === 'error'
        ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span>${msg}</span>`
        : `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert'; // reset

      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showAlert('Please enter your email and password.');
        return;
      }

      if (!client) {
        showAlert('CMS is not configured. Please check cms-config.js and ensure your Supabase credentials are set.');
        return;
      }

      btnLogin.classList.add('loading');
      btnLogin.disabled = true;

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          showAlert(error.message || 'Invalid email or password. Please try again.');
          return;
        }

        if (data.session) {
          showAlert('Login successful! Redirecting to dashboard…', 'success');
          setTimeout(() => {
            window.location.replace('phoadmindashboard.html');
          }, 800);
        }
      } catch (err) {
        showAlert('An unexpected error occurred. Please try again.');
      } finally {
        btnLogin.classList.remove('loading');
        btnLogin.disabled = false;
      }
    });
  </script>
</body>
</html>
