<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/pho_logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logo/pho_logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/pho_logo.png" />
  <title>PHO CMS Login</title>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cms-admin.css" />
</head>
<body class="cms-admin-body" data-cms-login="true">
  <main class="cms-auth-shell">
    <section class="cms-auth-card">
      <div class="cms-auth-brand">
        <img src="assets/logo/pho_logo.png" alt="PHO Bohol Logo" />
        <div>
          <h1 class="cms-auth-title">PHO CMS Login</h1>
          <p class="cms-auth-subtitle">Hidden administrator access for PHO website content management.</p>
        </div>
      </div>

      <form id="cms-login-form" class="cms-auth-form" novalidate>
        <div class="cms-field">
          <label for="login-email">Email Address</label>
          <input id="login-email" class="cms-input" type="email" autocomplete="username" required />
        </div>
        <div class="cms-field">
          <label for="login-password">Password</label>
          <input id="login-password" class="cms-input" type="password" autocomplete="current-password" required />
        </div>
        <button id="login-submit" type="submit" class="cms-button">Sign In</button>
        <div id="login-status" class="cms-login-notice" aria-live="polite" role="alert"></div>
      </form>
    </section>
  </main>

  <div id="login-loader" class="cms-loader" aria-hidden="true">
    <div class="cms-loader-panel">
      <div class="cms-spinner"></div>
      <p id="login-loader-message">Signing you in...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="env.js"></script>
  <script src="cms-config.js"></script>
  <script src="cms-common.js"></script>
  <script src="cms-login.js"></script>
</body>
</html>
